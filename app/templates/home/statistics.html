<!-- ==========================================
     STATISTICS SECTION
========================================== -->

<section class="statistics-section py-5">

    <div class="container">

        <div class="text-center mb-5" data-aos="fade-up">

            <span class="text-warning fw-bold text-uppercase">
                Our Impact
            </span>

            <h2 class="display-5 fw-bold mt-2">
                Making a Difference Across Ghana
            </h2>

            <p class="text-muted mx-auto" style="max-width:700px;">
                Together we are building stronger communities through
                leadership, education, development and active citizenship.
            </p>

        </div>

        <div class="row g-4">

            <!-- Members -->
            <div class="col-lg-3 col-md-6" data-aos="zoom-in">

                <div class="stat-card">

                    <div class="stat-icon">
                        <i class="fas fa-users"></i>
                    </div>

                    <h2 class="counter"
                        data-target="{{ stats.members_count }}">0</h2>

                    <p>Members</p>

                </div>

            </div>

            <!-- Leaders -->
            <div class="col-lg-3 col-md-6" data-aos="zoom-in" data-aos-delay="100">

                <div class="stat-card">

                    <div class="stat-icon">
                        <i class="fas fa-user-tie"></i>
                    </div>

                    <h2 class="counter"
                        data-target="{{ stats.leaders_count }}">0</h2>

                    <p>Leaders</p>

                </div>

            </div>

            <!-- News -->
            <div class="col-lg-3 col-md-6" data-aos="zoom-in" data-aos-delay="200">

                <div class="stat-card">

                    <div class="stat-icon">
                        <i class="fas fa-newspaper"></i>
                    </div>

                    <h2 class="counter"
                        data-target="{{ stats.news_count }}">0</h2>

                    <p>News Articles</p>

                </div>

            </div>

            <!-- Events -->
            <div class="col-lg-3 col-md-6" data-aos="zoom-in" data-aos-delay="300">

                <div class="stat-card">

                    <div class="stat-icon">
                        <i class="fas fa-calendar-alt"></i>
                    </div>

                    <h2 class="counter"
                        data-target="{{ stats.events_count }}">0</h2>

                    <p>Events</p>

                </div>

            </div>

        </div>

    </div>

</section>
