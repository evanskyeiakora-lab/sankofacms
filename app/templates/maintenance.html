
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Maintenance | {{ settings.site_name if settings else "Apex Citizens of Ghana" }}
    </title>

    <meta name="robots" content="noindex, nofollow">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #1f2937,
                    #374151
                );
            font-family: Arial, sans-serif;
            color: #ffffff;
        }

        .maintenance-card {
            width: 100%;
            max-width: 650px;
            margin: 20px;
            padding: 55px 35px;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
        }

        .maintenance-icon {
            font-size: 70px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        p {
            color: #e5e7eb;
            font-size: 17px;
            line-height: 1.8;
        }

        .brand {
            margin-top: 30px;
            color: #facc15;
            font-weight: 700;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="maintenance-card">

        <div class="maintenance-icon">
            🛠️
        </div>

        <h1>We'll Be Back Soon</h1>

        <p>
            Our website is currently undergoing scheduled maintenance
            and improvements.
        </p>

        <p>
            We are working to improve your experience.
            Please check back shortly.
        </p>

        <div class="brand">
            {{ settings.site_name if settings else "Apex Citizens of Ghana" }}
        </div>

    </div>

</body>
</html>
