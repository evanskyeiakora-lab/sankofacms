<section class="py-5 bg-white">

    <div class="container">

        <div class="text-center mb-5">

            <h2 class="section-title">
                Our Impact
            </h2>

            <p class="section-subtitle">
                Numbers that reflect our commitment to serving communities across Ghana.
            </p>

        </div>

        <div class="row g-4">

            <div class="col-lg-3 col-md-6">

                <div class="counter-box">

                    <i class="fas fa-users fa-3x text-success mb-3"></i>

                    <h2 class="counter"
                        data-target="{{ stats.members_count|default(0) }}">
                        0
                    </h2>

                    <p>Members</p>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="counter-box">

                    <i class="fas fa-newspaper fa-3x text-success mb-3"></i>

                    <h2 class="counter"
                        data-target="{{ stats.news_count|default(0) }}">
                        0
                    </h2>

                    <p>News Articles</p>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="counter-box">

                    <i class="fas fa-calendar-alt fa-3x text-success mb-3"></i>

                    <h2 class="counter"
                        data-target="{{ stats.events_count|default(0) }}">
                        0
                    </h2>

                    <p>Events</p>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="counter-box">

                    <i class="fas fa-images fa-3x text-success mb-3"></i>

                    <h2 class="counter"
                        data-target="{{ stats.gallery_count|default(0) }}">
                        0
                    </h2>

                    <p>Gallery Photos</p>

                </div>

            </div>

        </div>

    </div>

</section>
