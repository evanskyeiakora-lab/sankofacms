{% if pagination.pages > 1 %}

<nav>

    <ul class="pagination">

        {% for page in pagination.iter_pages() %}

            {% if page %}

                <li class="page-item {% if page == pagination.page %}active{% endif %}">

                    <a
                        class="page-link"
                        href="{{ url_for(request.endpoint, page=page) }}">

                        {{ page }}

                    </a>

                </li>

            {% endif %}

        {% endfor %}

    </ul>

</nav>

{% endif %}
