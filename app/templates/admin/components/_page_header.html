<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2 class="mb-1">
            {{ title }}
        </h2>

        {% if subtitle %}
        <p class="text-muted mb-0">
            {{ subtitle }}
        </p>
        {% endif %}

    </div>

    {% if create_url %}

    <a
        href="{{ create_url }}"
        class="btn btn-primary">

        <i class="bi bi-plus-circle"></i>

        {{ button_text or "Add New" }}

    </a>

    {% endif %}

</div>
