<section class="statistics-section py-5">

    <div class="container">

        <div class="row text-center g-4">

            <div class="col-lg-3 col-md-6">
                <div class="stat-card">

                    <i class="fas fa-users fa-3x mb-3 text-primary"></i>

                    <h2 class="counter" data-target="{{ stats.members_count }}">
                        0
                    </h2>

                    <p>Members</p>

                </div>
            </div>

            <div class="col-lg-3 col-md-6">
                <div class="stat-card">

                    <i class="fas fa-newspaper fa-3x mb-3 text-success"></i>

                    <h2 class="counter" data-target="{{ stats.news_count }}">
                        0
                    </h2>

                    <p>News Articles</p>

                </div>
            </div>

            <div class="col-lg-3 col-md-6">
                <div class="stat-card">

                    <i class="fas fa-calendar-alt fa-3x mb-3 text-warning"></i>

                    <h2 class="counter" data-target="{{ stats.events_count }}">
                        0
                    </h2>

                    <p>Events</p>

                </div>
            </div>

            <div class="col-lg-3 col-md-6">
                <div class="stat-card">

                    <i class="fas fa-images fa-3x mb-3 text-danger"></i>

                    <h2 class="counter" data-target="{{ stats.gallery_count }}">
                        0
                    </h2>

                    <p>Gallery Photos</p>

                </div>
            </div>

        </div>

    </div>

</section>
