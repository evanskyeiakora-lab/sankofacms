<div class="text-center py-5">

    <i class="fas fa-folder-open fa-4x text-secondary mb-3"></i>

    <h4 class="fw-bold">

        {{ title }}

    </h4>

    <p class="text-muted">

        {{ message }}

    </p>

    {% if button_url %}

        <a
            href="{{ button_url }}"
            class="btn btn-primary">

            <i class="fas fa-plus me-1"></i>

            {{ button_text }}

        </a>

    {% endif %}

</div>
