{% if pagination.pages > 1 %}

<nav class="mt-4">

    <ul class="pagination justify-content-center">

        {% for page in pagination.iter_pages() %}

            {% if page %}

            <li class="page-item {% if page == pagination.page %}active{% endif %}">

                <a
                    class="page-link"
                    href="?page={{ page }}{% if search %}&search={{ search }}{% endif %}">

                    {{ page }}

                </a>

            </li>

            {% endif %}

        {% endfor %}

    </ul>

</nav>

{% endif %}
