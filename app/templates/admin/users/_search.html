<form method="GET">

    <div class="row g-2">

        <div class="col-md-10">

            <input
                type="text"
                name="search"
                class="form-control"
                value="{{ search }}"
                placeholder="{{ placeholder }}">

        </div>

        <div class="col-md-2">

            <button
                class="btn btn-primary w-100">

                <i class="fas fa-search me-1"></i>

                Search

            </button>

        </div>

    </div>

</form>
