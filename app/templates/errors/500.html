
{% extends "layouts/public.html" %}

{% block title %}Server Error | Apex Citizens of Ghana{% endblock %}

{% block content %}

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center text-center">
            <div class="col-lg-8">

                <div class="mb-4">
                    <i class="fas fa-tools text-danger"
                       style="font-size: 80px;"></i>
                </div>

                <h1 class="display-1 fw-bold text-danger">500</h1>

                <h2 class="mb-3">Something Went Wrong</h2>

                <p class="lead text-muted mb-4">
                    We are sorry, but the server encountered an unexpected
                    problem. Please try again later.
                </p>

                <a href="{{ url_for('main.home') }}"
                   class="btn btn-primary btn-lg">
                    <i class="fas fa-home me-2"></i>
                    Return to Homepage
                </a>

                <a href="{{ url_for('contact.contact') }}"
                   class="btn btn-outline-secondary btn-lg ms-2">
                    Contact Us
                </a>

            </div>
        </div>
    </div>
</section>

{% endblock %}
